name: Build & Publish Docker Image

on:
  push:
    branches: [main, master]
    tags: ["v*", "[0-9]+.[0-9]+"]
  workflow_dispatch:

env:
  # Docker Hub 仓库名，可按需修改
  IMAGE_NAME: r2hub
  # 镜像版本号：发新版本时只需改这一行（如 1.1）
  VERSION: "1.0"

jobs:
  # ---------- 第一阶段：构建 + 冒烟测试（amd64，本地起容器验证） ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 构建镜像（仅 amd64，用于测试）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: r2hub:test

      - name: 启动容器并冒烟测试
        run: |
          docker run -d --name smoke \
            -p 8100:8100 \
            -e ADMIN_TOKEN=ci-smoke-token \
            -e COOKIE_SECURE=false \
            r2hub:test
          for i in $(seq 1 20); do
            sleep 2
            if curl -sf http://127.0.0.1:8100/health | grep -q '"status":"ok"'; then
              echo "健康检查通过"
              exit 0
            fi
          done
          echo "::error::健康检查失败"
          docker logs smoke
          exit 1

      - name: 验证管理页与文档页可访问
        run: |
          CODE1=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8100/)
          CODE2=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8100/docs)
          echo "管理页=$CODE1 文档页=$CODE2"
          [ "$CODE1" = "200" ] && [ "$CODE2" = "200" ]

# ---------- 第二阶段：多架构构建并推送（仅 main 分支或 v* 标签触发） ----------
  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: QEMU（跨架构支持）
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 生成标签（同一镜像双标签）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像地址
        run: echo "已推送 ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} 和 :latest"
